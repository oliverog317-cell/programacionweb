<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
    <title>Contacto | NexoTech</title>
</head>
<body>
    <header class="m-2 p-3">
        <nav class="navbar navbar-expand-lg bkg">
            <div class="container g-1">
                <img src="nexo-tech-svg.svg" alt="logo" height="40">
                <div class="d-flex align-items-center gap-3">
                    <a class="nav-link" href="inicio.html">Inicio</a>
                    <a class="nav-link" href="productos.html">Productos</a>
                    <a class="nav-link" href="contacto.html">Contactos</a>
                </div>
            </div>
        </nav>   
    </header>
    <main class="fondo">
        <div class="container py-5">
            <h2 class="text-center mb-5">Formulario de contacto</h2>
            <form class="mx-auto" style="max-width: 600px;">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingresá tu nombre">
                </div>
            </form>
            <form class="mx-auto" style="max-width: 600px;">
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" placeholder="ejemplo@gmail.com">
                </div>
            </form>
            <form class="mx-auto" style="max-width: 600px;">
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono:</label>
                    <input type="tel" class="form-control" id="telefono" placeholder="Ej: +54 123 4567">
                </div>
            </form>
            <form class="mx-auto" style="max-width: 600px;">
                <div class="mb-3">
                    <label for="asunto" class="form-label">Asunto:</label>
                    <input type="text" class="form-control align-items-baseline" placeholder="Dígamos el motivo de su mensaje">
                </div>
            </form>
            <form class="mx-auto" style="max-width: 600px;">
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje:</label>
                    <textarea id="mensaje" class="form-control" rows="6" placeholder="¿En que podemos ayudarte?"></textarea>
                    <div class="mb-3">
                        <button class="btn btn-primary mt-4 w-100 enviar">Enviar</button>
                    </div>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer mb-0">
        <div class="container py-5">
            <div class="row">
                <div class=" col-12 mb-3">
                    <h6 class="p-footer">NexoTech</h6>
                    <p class="text-secondary p-footer">Tecnología que potencia tu mundo</p>

                </div>
            </div>
            <div class="col-12 mb-3">
                <h6 class="p-footer">Enlaces</h6>
            </div>
            <div class="container">
                <div class="align-items-center g-3 referencias">
                    <a href="inicio.html" class="footer-link">Inicio</a> <br />
                    <a href="productos.html" class="footer-link">Productos</a> <br />
                    <a href="contacto.html" class="footer-link">Contactos</a>
                </div>
            </div>
            <div class="col-12 mb-3">
                <h6 class="p-footer mt-3">Contactos</h6>
                <div class="align-items-center g-3 referencias">
                    <a href="contacto.html" class="footer-link col-12 col-md-6 col-lg-3">Gmail: NexoTech@gmail.com</a> <br>
                    <a href="contacto.html" class="footer-link">Teléfono: +54 9 353 123-4567</a> <br>
                    <a href="contacto.html" class="footer-link">Dirección: Salta 1500</a>
                </div>
            </div>
            <div class="col-12 mb-3">
                <h6 class="derechos text-secondary mt-5">© 2026 NexoTech. Todos los derechos reservados.</h6>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
